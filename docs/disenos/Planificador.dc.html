      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #FFFFFF; border-radius: 14px; padding: 4px">

      <div style="display: flex; gap: 8px">

        <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #CBD2CE; background: #FFFFFF; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 600; color: #1B2420">Desayunos</button>
      </div>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 4px 16px">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #ECEFED">
        <div style="flex: 1"><div style="font-size: 15px; font-weight: 700">Adultos</div><div style="font-size: 12px; color: #5B6660">Ración completa</div></div>
        <button aria-label="Quitar un adulto" style="width: 40px; height: 40px; border-radius: 12px; border: 1.5px solid #CBD2CE; background: #FFFFFF; font-size: 20px; font-weight: 700; color: #1B2420">−</button>
        <div style="width: 28px; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700">4</div>
        <button aria-label="Añadir un adulto" style="width: 40px; height: 40px; border-radius: 12px; border: 1.5px solid #CBD2CE; background: #FFFFFF; font-size: 20px; font-weight: 700; color: #1B2420">+</button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0">
        <div style="flex: 1"><div style="font-size: 15px; font-weight: 700">Niños</div><div style="font-size: 12px; color: #5B6660">Media ración</div></div>
        <button aria-label="Quitar un niño" style="width: 40px; height: 40px; border-radius: 12px; border: 1.5px solid #CBD2CE; background: #FFFFFF; font-size: 20px; font-weight: 700; color: #1B2420">−</button>

      </div>
    </section>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <label for="presupuesto" style="font-size: 15px; font-weight: 700">Presupuesto de la semana</label>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700; color: #C2410C">60 €</span>
      </div>
      <div style="position: relative; height: 28px; display: flex; align-items: center">
        <div style="width: 100%; height: 8px; border-radius: 999px; background: #ECEFED"></div>
        <div style="position: absolute; left: 0; width: 40%; height: 8px; border-radius: 999px; background: #C2410C"></div>
        <div style="position: absolute; left: calc(40% - 13px); width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; border: 3px solid #C2410C; box-sizing: border-box"></div>
      </div>
      <div style="font-size: 12px; color: #5B6660">≈ 0,95 € por ración · comidas y cenas de 7 días</div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 14px; font-weight: 700">Preferencias</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #1F5F7A; background: #E1EEF3; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 700; color: #174A5F">Menos de 30 min</button>
        <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #1F5F7A; background: #E1EEF3; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 700; color: #174A5F">Aprovechar sobras</button>
        <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #CBD2CE; background: #FFFFFF; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 600; color: #1B2420">Cocinar el domingo</button>
        <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #CBD2CE; background: #FFFFFF; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 600; color: #1B2420">Sin picante</button>
        <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px dashed #A9B3AE; background: transparent; font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 600; color: #5B6660">+ Alergias o no nos gusta…</button>

    </section>

    <div style="font-size: 12px; color: #5B6660">Precios de Mercadona y Dia · estimados, mejoran con vuestros tickets</div>

    <a href="Menu.dc.html" style="height: 56px; border-radius: 16px; background: #C2410C; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none">Crear menú</a>
  </main>
